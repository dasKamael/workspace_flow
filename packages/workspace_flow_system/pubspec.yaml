name: workspace_flow_system
description: macOS system bridge for Focus — screens, app launching, window control, menu bar, login item.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ^3.41.9

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: WorkspaceFlowSystemPlugin
