name: workspace_flow
description: "Focus App for macOS — Projects, App Blocker, Focus Session."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5
  flutter: ^3.41.9

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Riverpod (State Management + DI)
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Data Classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0 # JSON for the models that cross the method channel

  # Router
  go_router: ^18.0.0

  # Database
  drift: ^2.28.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Window
  window_manager: ^0.5.0

  # macOS system bridge (screens, launching, window control, menu bar, login item)
  workspace_flow_system:
    path: packages/workspace_flow_system

  # Utils
  collection: ^1.19.0
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  freezed: ^4.0.1
  json_serializable: ^6.9.0
  drift_dev: ^2.28.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
